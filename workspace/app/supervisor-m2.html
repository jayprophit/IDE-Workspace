<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Aetherius — Supervisor</title>
    <style>
      /* =====================================================================
         AETHERIUS SUPERVISOR — M2 AVATAR-FIRST MISSION CONTROL
         Design language transcribed from the owner reference set
         (Aetherius IDE / NEXUS / NOVA / OE): dark navy base, cyan-blue
         luminous edges, glass surfaces, blue->violet gradients.
         All data is LIVE_VERIFIED or honestly tagged. No fabricated state.

         NOTE (§49): this is the M2 presentation shell. The tested React unit
         in src/supervisor-ui remains the network client of record; M2-A/M2-B
         migrate this shell INTO that unit (client.ts boundary + tokens.css).
         ===================================================================== */
      :root {
        --bg-canvas: #0a0e1a;
        --bg-sidebar: #0f1420;
        --bg-panel: #151b2b;
        --bg-elevated: #1a2138;
        --bg-code: #0d1117;
        --border: #252d42;
        --border-strong: #334155;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --blue: #3b82f6;
        --blue-light: #60a5fa;
        --violet: #8b5cf6;
        --cyan: #22d3ee;
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        --grad-primary: linear-gradient(135deg, #3b82f6, #8b5cf6);
        --grad-text: linear-gradient(90deg, #60a5fa, #a78bfa);
        --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        background: var(--bg-canvas); color: var(--text-primary);
        font-family: var(--font); font-size: 14px; overflow: hidden;
      }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: var(--bg-canvas); }
      ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

      .app { display: flex; flex-direction: column; height: 100vh; }
      .topbar {
        height: 56px; flex-shrink: 0; display: flex; align-items: center;
        gap: 16px; padding: 0 16px; background: var(--bg-sidebar);
        border-bottom: 1px solid var(--border);
      }
      .brand { display: flex; align-items: center; gap: 10px; }
      .brand-mark {
        width: 28px; height: 28px; border-radius: 8px; background: var(--grad-primary);
        display: grid; place-items: center; box-shadow: 0 0 16px rgba(59,130,246,.4);
        font-weight: 800; font-size: 14px; color: #fff;
      }
      .brand-name { font-weight: 700; font-size: 15px; letter-spacing: .2px; }
      .brand-tag { font-size: 11px; color: var(--text-muted); }
      .mode-toggle { display: flex; background: var(--bg-elevated); border-radius: 999px; padding: 3px; gap: 2px; }
      .mode-toggle button {
        border: 0; background: transparent; color: var(--text-secondary);
        font: 600 12px var(--font); padding: 5px 14px; border-radius: 999px; cursor: pointer; transition: all .15s;
      }
      .mode-toggle button.active { background: var(--grad-primary); color: #fff; }
      .topbar-spacer { flex: 1; }
      .search {
        display: flex; align-items: center; gap: 8px; background: var(--bg-elevated);
        border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; width: 240px;
      }
      .search input { background: transparent; border: 0; outline: 0; color: var(--text-primary); font: 13px var(--font); width: 100%; }
      .search input::placeholder { color: var(--text-muted); }
      .env-status { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-secondary); }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 8px var(--success); }
      .dot.warn { background: var(--warning); box-shadow: 0 0 8px var(--warning); }
      .dot.err { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
      .avatar-me { width: 30px; height: 30px; border-radius: 50%; background: var(--grad-primary); display: grid; place-items: center; font-weight: 700; font-size: 12px; color: #fff; }

      .shell { display: flex; flex: 1; min-height: 0; }
      .rail {
        width: 56px; flex-shrink: 0; background: var(--bg-sidebar);
        border-right: 1px solid var(--border); display: flex; flex-direction: column;
        align-items: center; padding: 10px 0; gap: 4px;
      }
      .rail button {
        width: 40px; height: 40px; border: 0; background: transparent; border-radius: 10px;
        color: var(--text-muted); cursor: pointer; display: grid; place-items: center;
        font-size: 18px; transition: all .15s; position: relative;
      }
      .rail button:hover { background: var(--bg-elevated); color: var(--text-primary); }
      .rail button.active { background: var(--grad-primary); color: #fff; box-shadow: 0 4px 14px rgba(59,130,246,.35); }
      .rail button .tip {
        position: absolute; left: 48px; white-space: nowrap; background: var(--bg-elevated);
        border: 1px solid var(--border); padding: 4px 10px; border-radius: 6px; font-size: 12px;
        color: var(--text-primary); opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 50;
      }
      .rail button:hover .tip { opacity: 1; }

      .sidebar {
        width: 268px; flex-shrink: 0; background: var(--bg-sidebar);
        border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto;
      }
      .sidebar-scroll { padding: 12px; display: flex; flex-direction: column; gap: 16px; }
      .new-btn {
        width: 100%; background: var(--grad-primary); color: #fff; border: 0; border-radius: 8px;
        padding: 9px 14px; font: 600 13px var(--font); cursor: pointer;
        display: flex; align-items: center; justify-content: center; gap: 6px;
        box-shadow: 0 4px 14px rgba(59,130,246,.3);
      }
      .sec-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); padding: 0 4px; margin-bottom: 6px; }
      .conv { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; cursor: pointer; transition: background .12s; }
      .conv:hover { background: var(--bg-elevated); }
      .conv.active { background: var(--bg-elevated); border-left: 3px solid var(--blue); }
      .conv-ic { width: 30px; height: 30px; border-radius: 7px; background: var(--bg-elevated); display: grid; place-items: center; font-size: 14px; flex-shrink: 0; }
      .conv-title { font-size: 13px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .conv-sub { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
      .usage-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
      .usage-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 8px 0 6px; }
      .usage-fill { height: 100%; background: var(--grad-primary); border-radius: 3px; transition: width .4s; }

      .center { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; }
      .center-head { padding: 16px 20px 0; display: flex; align-items: flex-start; justify-content: space-between; }
      .hero-h { font-size: 26px; font-weight: 700; letter-spacing: -.4px; }
      .hero-h .grad { background: var(--grad-text); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
      .hero-sub { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

      .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap: 10px; padding: 16px 20px; }
      .stat { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
      .stat-k { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); font-weight: 700; }
      .stat-v { font-size: 24px; font-weight: 700; margin-top: 4px; }
      .stat-v.blue { color: var(--blue-light); }
      .stat-v.green { color: var(--success); }
      .stat-v.amber { color: var(--warning); }
      .stat-v.violet { color: var(--violet); }

      .section-h { display: flex; align-items: center; justify-content: space-between; padding: 4px 20px 10px; }
      .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary); }
      .worker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap: 12px; padding: 0 20px 20px; }
      .wcard { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px; cursor: pointer; transition: all .15s; position: relative; }
      .wcard:hover { border-color: var(--blue); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(59,130,246,.18); }
      .wcard.selected { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue), 0 8px 24px rgba(59,130,246,.22); }
      .wcard-top { display: flex; align-items: center; gap: 12px; }
      .wav { width: 52px; height: 52px; border-radius: 14px; flex-shrink: 0; display: grid; place-items: center; font-weight: 800; font-size: 18px; color: #fff; }
      .wname { font-size: 14px; font-weight: 700; }
      .wrole { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
      .wstatus { position: absolute; top: 14px; right: 14px; width: 9px; height: 9px; border-radius: 50%; }
      .wmeta { margin-top: 12px; display: flex; flex-direction: column; gap: 5px; }
      .wrow { display: flex; justify-content: space-between; font-size: 11.5px; }
      .wrow .k { color: var(--text-muted); }
      .wrow .v { color: var(--text-secondary); font-weight: 500; max-width: 60%; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .04em; }
      .badge.run { background: rgba(16,185,129,.15); color: var(--success); }
      .badge.idle { background: rgba(245,158,11,.15); color: var(--warning); }
      .badge.quota { background: rgba(239,68,68,.15); color: var(--danger); }
      .badge.off { background: rgba(100,116,139,.18); color: var(--text-muted); }

      .inspector { width: 380px; flex-shrink: 0; background: var(--bg-sidebar); border-left: 1px solid var(--border); overflow-y: auto; display: flex; flex-direction: column; }
      .insp-head { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
      .insp-av { width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; font-weight: 800; font-size: 24px; color: #fff; }
      .insp-name { font-size: 16px; font-weight: 700; }
      .insp-role { font-size: 12px; color: var(--text-secondary); }
      .insp-actions { display: flex; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
      .abtn {
        flex: 1; min-width: 90px; border: 1px solid var(--border-strong); background: var(--bg-elevated);
        color: var(--text-primary); border-radius: 8px; padding: 8px 10px; font: 600 12px var(--font);
        cursor: pointer; transition: all .12s; display: flex; align-items: center; justify-content: center; gap: 5px;
      }
      .abtn:hover { border-color: var(--blue); color: var(--blue-light); }
      .abtn.primary { background: var(--grad-primary); border: 0; color: #fff; }
      .abtn.primary:hover { filter: brightness(1.1); }
      .abtn:disabled { opacity: .45; cursor: not-allowed; }
      .insp-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
      .kv { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
      .kv .k { color: var(--text-muted); }
      .kv .v { color: var(--text-primary); font-weight: 500; text-align: right; max-width: 62%; word-break: break-word; }
      .mono { font-family: var(--mono); font-size: 11px; }
      .insp-empty { flex: 1; display: grid; place-items: center; color: var(--text-muted); font-size: 13px; text-align: center; padding: 40px 20px; }

      .srcfact { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; color: var(--text-muted); }
      .srcfact .sf-dot { width: 6px; height: 6px; border-radius: 50%; }

      .toast {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: var(--bg-elevated); border: 1px solid var(--border-strong); padding: 10px 18px;
        border-radius: 10px; font-size: 13px; color: var(--text-primary); box-shadow: 0 10px 30px rgba(0,0,0,.5);
        z-index: 100; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 70%;
      }
      .toast.show { opacity: 1; }
      .toast.ok { border-color: var(--success); }
      .toast.err { border-color: var(--danger); }

      .conn-banner { background: rgba(239,68,68,.12); border-bottom: 1px solid var(--danger); color: var(--danger); font-size: 12px; padding: 7px 16px; text-align: center; display: none; }
      .conn-banner.show { display: block; }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="conn-banner" id="connBanner">Supervisor API unreachable — showing last known state. Facts are NOT live.</div>

      <div class="topbar">
        <div class="brand">
          <div class="brand-mark">Æ</div>
          <div>
            <div class="brand-name">Aetherius</div>
            <div class="brand-tag">Supervisor · Ideas to impact, together.</div>
          </div>
        </div>
        <div class="mode-toggle">
          <button class="active" id="modeLive">LIVE</button>
          <button id="modeDesign">DESIGN</button>
        </div>
        <div class="topbar-spacer"></div>
        <div class="search"><span>🔍</span><input id="searchBox" placeholder="Search workers..." /></div>
        <div class="env-status"><span class="dot" id="envDot"></span><span id="envText">Supervisor LIVE</span></div>
        <div class="avatar-me">JP</div>
      </div>

      <div class="shell">
        <div class="rail" id="rail"></div>
        <div class="sidebar"><div class="sidebar-scroll" id="sidebar"></div></div>
        <div class="center">
          <div class="center-head">
            <div>
              <div class="hero-h">Mission <span class="grad">Control.</span></div>
              <div class="hero-sub" id="heroSub">Workforce status, live from the supervisor runtime.</div>
            </div>
            <div class="srcfact" id="lastSeen"></div>
          </div>
          <div class="stats" id="stats"></div>
          <div class="section-h"><div class="section-title">Workforce</div><div class="srcfact" id="wfSource"></div></div>
          <div class="worker-grid" id="workerGrid"></div>
        </div>
        <div class="inspector" id="inspector"></div>
      </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
      // Aetherius Supervisor M2 — live client. Every value is a SourceFact
      // {value, state, source, observed_at}. We render the value and carry the
      // state; a non-LIVE fact is tagged, a missing fact renders NOT_EXPOSED,
      // and NOTHING is fabricated.
      const BASE = '/api/v1/supervisor';
      const STATE = { snapshot: null, live: true, selected: null, poll: null };

      const RAIL = [
        { id: 'mission', icon: '⌂', label: 'Mission Control' },
        { id: 'chat', icon: '💬', label: 'Chat' },
        { id: 'work', icon: '⌨', label: 'Work' },
        { id: 'projects', icon: '📁', label: 'Projects' },
        { id: 'teams', icon: '👥', label: 'Teams' },
        { id: 'conference', icon: '🎥', label: 'Conference' },
        { id: 'tasks', icon: '✓', label: 'Tasks' },
        { id: 'knowledge', icon: '📚', label: 'Knowledge' },
        { id: 'quotas', icon: '⚡', label: 'Quotas / Usage' },
        { id: 'git', icon: '⌥', label: 'Git / Repos' },
      ];

      function hue(id) { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
      function avGrad(id) { const h = hue(id); return `linear-gradient(135deg, hsl(${h},70%,55%), hsl(${(h + 55) % 360},70%,48%))`; }
      function initials(id) {
        const parts = id.replace(/[-_]/g, ' ').split(' ').filter(Boolean);
        return (parts[0][0] + (parts[1] ? parts[1][0] : parts[0][1] || '')).toUpperCase();
      }
      function fact(sec, key) {
        const f = sec && sec[key];
        if (!f) return { value: null, state: 'NOT_EXPOSED', source: 'absent' };
        return f;
      }
      function fv(sec, key, dflt) {
        const f = fact(sec, key);
        return (f.state === 'NOT_EXPOSED' || f.value == null) ? dflt : f.value;
      }
      function statusClass(status) {
        const s = (status || '').toUpperCase();
        if (s.includes('WAITING') || s.includes('QUOTA')) return 'quota';
        if (s === 'IMPLEMENTING' || s === 'RUNNING' || s === 'ACTIVE') return 'run';
        if (s === 'IDLE' || s === 'WAITING') return 'idle';
        if (s === 'OFFLINE') return 'off';
        return 'idle';
      }
      function statusColor(cls) {
        return cls === 'run' ? 'var(--success)' : cls === 'quota' ? 'var(--danger)'
          : cls === 'off' ? 'var(--text-muted)' : 'var(--warning)';
      }
      async function jget(path) {
        const r = await fetch(BASE + path);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }
      async function refresh() {
        try {
          const d = await jget('/state');
          STATE.snapshot = d.snapshot || d;
          STATE.live = true;
          document.getElementById('connBanner').classList.remove('show');
          document.getElementById('envDot').className = 'dot';
          document.getElementById('envText').textContent = 'Supervisor LIVE';
        } catch (e) {
          STATE.live = false;
          document.getElementById('connBanner').classList.add('show');
          document.getElementById('envDot').className = 'dot err';
          document.getElementById('envText').textContent = 'API unreachable';
          if (!STATE.snapshot) return;
        }
        render();
      }
      function render() {
        const s = STATE.snapshot;
        if (!s) return;
        const sup = (s.sections && s.sections.supervision) || {};
        const res = (s.sections && s.sections.resources) || {};
        renderRail();
        renderSidebar(sup);
        renderStats(sup, res);
        renderWorkers(sup);
        renderInspector();
        document.getElementById('wfSource').innerHTML = srcChip(fact(sup, 'workers_total'));
        const gen = s.generated_at ? new Date(s.generated_at).toLocaleTimeString() : '';
        document.getElementById('lastSeen').innerHTML =
          `<span class="sf-dot" style="background:${STATE.live ? 'var(--success)' : 'var(--danger)'}"></span> ${STATE.live ? 'LIVE' : 'STALE'} · ${gen}`;
      }
      function srcChip(f) {
        const c = f.state === 'LIVE_VERIFIED' ? 'var(--success)' : f.state === 'NOT_EXPOSED' ? 'var(--warning)' : 'var(--text-muted)';
        return `<span class="srcfact"><span class="sf-dot" style="background:${c}"></span>${f.state || 'UNKNOWN'}</span>`;
      }
      function renderRail() {
        const el = document.getElementById('rail');
        if (el.dataset.built) return;
        el.dataset.built = '1';
        el.innerHTML = RAIL.map((r, i) =>
          `<button class="${i === 0 ? 'active' : ''}" data-act="${r.id}">${r.icon}<span class="tip">${r.label}</span></button>`
        ).join('');
        el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
          el.querySelectorAll('button').forEach(x => x.classList.remove('active'));
          b.classList.add('active');
          if (b.dataset.act !== 'mission') {
            const label = RAIL.find(r => r.id === b.dataset.act).label;
            toast(`${label} — NOT_IMPLEMENTED (M3). Mission Control is live.`, 'err');
          }
        }));
      }
      function renderSidebar(sup) {
        const workers = fact(sup, 'workers').value || [];
        const active = workers.filter(w => statusClass(w.status) === 'run').length;
        const contReq = fv(sup, 'continuation_required', false);
        document.getElementById('sidebar').innerHTML = `
          <button class="new-btn" id="newTaskBtn">＋ Assign Task</button>
          <div>
            <div class="sec-label">Workforce</div>
            ${workers.map(w => `
              <div class="conv ${STATE.selected === w.worker_id ? 'active' : ''}" data-wid="${w.worker_id}">
                <div class="conv-ic" style="background:${avGrad(w.worker_id)}22;color:var(--blue-light)">${initials(w.worker_id)}</div>
                <div style="min-width:0">
                  <div class="conv-title">${w.worker_id}</div>
                  <div class="conv-sub"><span class="dot ${statusClass(w.status) === 'run' ? '' : statusClass(w.status) === 'off' ? 'err' : 'warn'}" style="width:6px;height:6px"></span>${w.status || 'UNKNOWN'}</div>
                </div>
              </div>`).join('') || '<div style="color:var(--text-muted);font-size:12px;padding:8px">No workers exposed.</div>'}
          </div>
          <div class="usage-card">
            <div class="sec-label" style="margin-bottom:0">Runtime</div>
            <div style="font-size:12px;color:var(--text-secondary);margin-top:6px">Continuation required</div>
            <div class="usage-bar"><div class="usage-fill" style="width:${contReq ? '100%' : '0%'}"></div></div>
            <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted)">
              <span>${contReq ? 'ACTIVE' : 'QUIET'}</span>
              <span>${active}/${workers.length} running</span>
            </div>
          </div>`;
        document.getElementById('sidebar').querySelectorAll('.conv').forEach(c =>
          c.addEventListener('click', () => selectWorker(c.dataset.wid)));
        document.getElementById('newTaskBtn').addEventListener('click', () =>
          toast('Assign Task — NOT_IMPLEMENTED (M3). Use the inspector Continue for now.', 'err'));
      }
      function renderStats(sup, res) {
        const workers = fact(sup, 'workers').value || [];
        const byStatus = fv(sup, 'workers_by_status', {}) || {};
        const running = byStatus.IMPLEMENTING || byStatus.RUNNING || 0;
        const quota = workers.filter(w => statusClass(w.status) === 'quota').length;
        const pressure = fv(res, 'pressure_state', 'UNKNOWN');
        const contReq = fv(sup, 'continuation_required', false);
        const handoffs = fv(sup, 'handoffs_pending', 0);
        const gaps = fv(sup, 'gaps_open', 0);
        const stats = [
          { k: 'Programme', v: contReq ? 'ACTIVE' : 'QUIET', cls: contReq ? 'green' : 'amber' },
          { k: 'Active Workers', v: running, cls: 'blue' },
          { k: 'Total Workers', v: workers.length, cls: 'violet' },
          { k: 'Waiting Quota', v: quota, cls: quota ? 'amber' : 'green' },
          { k: 'Handoffs Pending', v: handoffs, cls: handoffs ? 'amber' : 'green' },
          { k: 'Open Gaps', v: gaps, cls: gaps ? 'amber' : 'green' },
          { k: 'Resources', v: String(pressure).toUpperCase(), cls: pressure === 'NOMINAL' ? 'green' : 'amber' },
        ];
        document.getElementById('stats').innerHTML = stats.map(st =>
          `<div class="stat"><div class="stat-k">${st.k}</div><div class="stat-v ${st.cls}">${st.v}</div></div>`
        ).join('');
      }
      function renderWorkers(sup) {
        const workers = fact(sup, 'workers').value || [];
        const q = (document.getElementById('searchBox').value || '').toLowerCase();
        const shown = workers.filter(w => !q || w.worker_id.toLowerCase().includes(q) || (w.role || '').toLowerCase().includes(q));
        document.getElementById('workerGrid').innerHTML = shown.map(w => {
          const cls = statusClass(w.status);
          const qs = w.quota_state || {};
          const hb = w.last_heartbeat ? Math.max(0, Math.round((Date.now() / 1000) - w.last_heartbeat)) : null;
          return `
          <div class="wcard ${STATE.selected === w.worker_id ? 'selected' : ''}" data-wid="${w.worker_id}">
            <span class="wstatus" style="background:${statusColor(cls)};box-shadow:0 0 8px ${statusColor(cls)}"></span>
            <div class="wcard-top">
              <div class="wav" style="background:${avGrad(w.worker_id)}">${initials(w.worker_id)}</div>
              <div style="min-width:0">
                <div class="wname">${w.worker_id}</div>
                <div class="wrole">${w.role || w.application || 'worker'}</div>
              </div>
            </div>
            <div style="margin-top:10px"><span class="badge ${cls}">${w.status || 'UNKNOWN'}</span></div>
            <div class="wmeta">
              <div class="wrow"><span class="k">Application</span><span class="v">${w.application || '—'}</span></div>
              <div class="wrow"><span class="k">Project</span><span class="v">${w.project || '—'}</span></div>
              <div class="wrow"><span class="k">Task</span><span class="v">${w.task_description || '—'}</span></div>
              <div class="wrow"><span class="k">Heartbeat</span><span class="v">${hb != null ? hb + 's ago' : '—'}</span></div>
              ${qs.reset_at ? `<div class="wrow"><span class="k">Quota reset</span><span class="v" style="color:var(--danger)">${qs.reset_at}</span></div>` : ''}
            </div>
          </div>`;
        }).join('') || '<div style="color:var(--text-muted);padding:20px">No workers match.</div>';
        document.getElementById('workerGrid').querySelectorAll('.wcard').forEach(c =>
          c.addEventListener('click', () => selectWorker(c.dataset.wid)));
      }
      function selectWorker(wid) { STATE.selected = wid; render(); }
      function renderInspector() {
        const sup = (STATE.snapshot && STATE.snapshot.sections.supervision) || {};
        const workers = fact(sup, 'workers').value || [];
        const w = workers.find(x => x.worker_id === STATE.selected);
        const el = document.getElementById('inspector');
        if (!w) {
          el.innerHTML = `<div class="insp-empty">Select a worker to inspect<br/>its live state and controls.</div>`;
          return;
        }
        const cls = statusClass(w.status);
        const qs = w.quota_state || {};
        el.innerHTML = `
          <div class="insp-head">
            <div class="insp-av" style="background:${avGrad(w.worker_id)}">${initials(w.worker_id)}</div>
            <div>
              <div class="insp-name">${w.worker_id}</div>
              <div class="insp-role">${w.role || ''} · ${w.application || ''}</div>
              <div style="margin-top:6px"><span class="badge ${cls}">${w.status || 'UNKNOWN'}</span></div>
            </div>
          </div>
          <div class="insp-actions">
            <button class="abtn primary" id="actContinue">▶ Continue</button>
            <button class="abtn" id="actMessage" disabled title="M3">💬 Message</button>
            <button class="abtn" id="actPause" disabled title="M3">⏸ Pause</button>
            <button class="abtn" id="actReassign" disabled title="M3">⇄ Reassign</button>
          </div>
          <div class="insp-body">
            <div class="kv"><span class="k">Worker ID</span><span class="v mono">${w.worker_id}</span></div>
            <div class="kv"><span class="k">Type</span><span class="v">${w.worker_type || '—'}</span></div>
            <div class="kv"><span class="k">Model</span><span class="v">${w.model || 'NOT_EXPOSED'}</span></div>
            <div class="kv"><span class="k">Project</span><span class="v">${w.project || 'NOT_EXPOSED'}</span></div>
            <div class="kv"><span class="k">Current task</span><span class="v">${w.task_description || 'NOT_EXPOSED'}</span></div>
            <div class="kv"><span class="k">Last heartbeat</span><span class="v">${w.last_heartbeat ? new Date(w.last_heartbeat * 1000).toLocaleTimeString() : '—'}</span></div>
            <div class="kv"><span class="k">Quota pool</span><span class="v">${qs.pool || 'NOT_EXPOSED'}</span></div>
            ${qs.reset_at ? `<div class="kv"><span class="k">Quota reset</span><span class="v" style="color:var(--danger)">${qs.reset_at}</span></div>` : ''}
            <div class="kv"><span class="k">Next action</span><span class="v">${w.next_action || 'NOT_EXPOSED'}</span></div>
            <div class="kv"><span class="k">Source</span><span class="v">${srcChip(fact(sup, 'workers'))}</span></div>
          </div>`;
        document.getElementById('actContinue').addEventListener('click', () => continueWorker(w.worker_id));
      }
      async function continueWorker(wid) {
        try {
          const r = await fetch(`${BASE}/worker/${encodeURIComponent(wid)}/continue`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}',
          });
          const d = await r.json();
          const ok = d.ok && d.result && d.result.delivered;
          toast(ok ? `Continue delivered to ${wid}.` : `Continue NOT delivered to ${wid} (${(d.result && d.result.error) || 'unknown'}).`, ok ? 'ok' : 'err');
        } catch (e) {
          toast(`Continue failed: ${e.message}`, 'err');
        }
        refresh();
      }
      let toastTimer = null;
      function toast(msg, kind) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast show ' + (kind || '');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
      }
      document.getElementById('searchBox').addEventListener('input', () => {
        const sup = (STATE.snapshot && STATE.snapshot.sections.supervision) || {};
        renderWorkers(sup);
      });
      document.getElementById('modeDesign').addEventListener('click', () =>
        toast('DESIGN mode (fixture preview) — NOT_IMPLEMENTED (M3). LIVE only for now.', 'err'));

      refresh();
      STATE.poll = setInterval(refresh, 3000);
    </script>
  </body>
</html>
